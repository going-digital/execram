name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # vasm and vlink have no official package on either runner image, and
      # per their license (docs/LICENSES.md) we don't vendor them in this
      # repo - so build both fresh from upstream source every run. A few
      # seconds each. Both vasm syntax modules are needed: mot for every
      # stub except inflate's, std for that one (see
      # stubs/inflate/README.md) - and since stub_inflate is embedded in
      # the shipped binary, not just tests, plain `zig build` needs both.
      - name: Build vasm (m68k/mot and m68k/std)
        run: |
          curl -sL -o /tmp/vasm.tar.gz http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf /tmp/vasm.tar.gz -C /tmp
          make -C /tmp/vasm CPU=m68k SYNTAX=mot
          make -C /tmp/vasm CPU=m68k SYNTAX=std
          echo "/tmp/vasm" >> "$GITHUB_PATH"

      - name: Build vlink
        run: |
          curl -sL -o /tmp/vlink.tar.gz http://sun.hasenbraten.de/vlink/release/vlink.tar.gz
          tar xzf /tmp/vlink.tar.gz -C /tmp
          make -C /tmp/vlink
          echo "/tmp/vlink" >> "$GITHUB_PATH"

      - name: zig build test
        run: zig build test --summary all

      - name: zig build
        run: zig build --summary all

      # M6 ratio/speed regression tracking (PROJECT_PLAN.md): host-side
      # only (packs a fixed set of test programs and compares sizes
      # against the committed baseline) - no FS-UAE, no Kickstart ROM,
      # so unlike tests/uae/* this can run here. Fails only if a
      # backend's output *grew* versus the baseline; an improvement is
      # reported, not treated as a failure - see the script's own
      # module doc for why.
      - name: Track compression ratios
        run: python3 tests/ratio/track_ratios.py ./zig-out/bin/execram vasmm68k_mot vlink
