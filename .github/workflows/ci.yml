name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # vasm and vlink have no official package on either runner image, and
      # per their license (docs/LICENSES.md) we don't vendor them in this
      # repo - so build both fresh from upstream source every run. A few
      # seconds each.
      - name: Build vasm (m68k/mot)
        run: |
          curl -sL -o /tmp/vasm.tar.gz http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf /tmp/vasm.tar.gz -C /tmp
          make -C /tmp/vasm CPU=m68k SYNTAX=mot
          echo "/tmp/vasm" >> "$GITHUB_PATH"

      - name: Build vlink
        run: |
          curl -sL -o /tmp/vlink.tar.gz http://sun.hasenbraten.de/vlink/release/vlink.tar.gz
          tar xzf /tmp/vlink.tar.gz -C /tmp
          make -C /tmp/vlink
          echo "/tmp/vlink" >> "$GITHUB_PATH"

      - name: zig build test
        run: zig build test --summary all

      - name: zig build
        run: zig build --summary all
